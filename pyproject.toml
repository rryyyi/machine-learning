[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neu-plant-classifier"
version = "0.1.0"
description = "ResNet18 transfer-learning baseline for the NEU plant classification assignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=9.0",
]

[project.scripts]
plant-train = "plant_classifier.engine.train:main"
plant-predict = "plant_classifier.engine.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plant_classifier*"]
